<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude limits</title>
<style>
  :root { --five_hour: #027aff; --seven_day: #ba66ff; --fable: #e9973f; }
  html { background: #1c2127; color: #dadada; font: 15px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(700px, 100vw - 48px); padding: 48px 0; }
  main.stale .tiles, main.stale figure { opacity: .45; }
  main.empty .tiles, main.empty figure { display: none; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; }
  h2 { margin: 0; font-size: .8rem; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--line); }
  .pct { margin: .1em 0 0; font-size: 4rem; font-weight: 200; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .reset { margin: 0 0 1em; color: #5c6370; min-height: 1.5em; }
  .bar { height: 2px; background: #2c323a; }
  .bar i { display: block; height: 100%; background: var(--line); }
  #five_hour { --line: var(--five_hour); }
  #seven_day { --line: var(--seven_day); }
  #fable { --line: var(--fable); }
  .warn .pct { color: #e0de71; }
  .warn .bar i { background: #e0de71; }

  figure { margin: 64px 0 0; }
  svg { display: block; width: 100%; height: 160px; overflow: visible; }
  .grid { stroke: #2c323a; stroke-width: 1; vector-effect: non-scaling-stroke; }
  path { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  #line-five_hour { stroke: var(--five_hour); }
  #line-seven_day { stroke: var(--seven_day); }
  #line-fable { stroke: var(--fable); }
  #days { position: relative; height: 1.5em; margin-top: .5em; font-size: .75rem; color: #5c6370; }
  #days span { position: absolute; padding-left: .4em; border-left: 1px solid #2c323a; }
  figcaption { margin-top: 1em; font-size: .75rem; color: #5c6370; display: flex; gap: 1.5em; }
  figcaption i { display: inline-block; width: 1.2em; height: 0; margin-right: .5em; vertical-align: middle; border-top: 1.5px solid; }
  figcaption .h5 i { color: var(--five_hour); }
  figcaption .d7 i { color: var(--seven_day); }
  figcaption .fb i { color: var(--fable); }
  nav { margin-left: auto; display: flex; gap: 1.5em; }
  nav a { color: #5c6370; text-decoration: none; }
  nav a.on { color: #dadada; }

  footer { margin-top: 48px; font-size: .75rem; color: #5c6370; }
</style>
<main>
  <div class="tiles">
    <section id="five_hour"><h2>5 h</h2><p class="pct"></p><p class="reset"></p><div class="bar"><i></i></div></section>
    <section id="seven_day"><h2>7 d</h2><p class="pct"></p><p class="reset"></p><div class="bar"><i></i></div></section>
    <section id="fable"><h2>Fable</h2><p class="pct"></p><p class="reset"></p><div class="bar"><i></i></div></section>
  </div>
  <figure>
    <svg viewBox="0 0 700 160" preserveAspectRatio="none">
      <line class="grid" x1="0" x2="700" y1="0" y2="0"/>
      <line class="grid" x1="0" x2="700" y1="80" y2="80"/>
      <line class="grid" x1="0" x2="700" y1="160" y2="160"/>
      <path id="line-five_hour"/>
      <path id="line-seven_day"/>
      <path id="line-fable"/>
    </svg>
    <div id="days"></div>
    <figcaption>
      <span class="h5"><i></i>5 h</span><span class="d7"><i></i>7 d</span><span class="fb"><i></i>Fable</span>
      <nav><a data-days="7">7 d</a><a data-days="30">30 d</a><a data-days="all">all</a></nav>
    </figcaption>
  </figure>
  <footer id="asof"></footer>
</main>
<script src="limits.js"></script>
<script>
// A page opened from disk may not fetch a file, but it may load one as a script.
const PARAMS = new URLSearchParams(location.search);
const DIR = PARAMS.get('dir') || 'file:///Users/Shared/claude-limits';
const DAYS = PARAMS.get('days') || '7';
const SOURCES = ['hw', 'reconnact', 'usage-for-claude'];
for (const a of document.querySelectorAll('nav a')) {
  const params = new URLSearchParams(PARAMS);
  params.set('days', a.dataset.days);
  a.href = `?${params}`;
  a.classList.toggle('on', a.dataset.days === DAYS);
}
var S = [];
let left = SOURCES.length;
for (const name of SOURCES) {
  const el = document.createElement('script');
  el.src = `${DIR}/${name}.js`;
  el.onload = el.onerror = () => { if (!--left) Limits.render(document, S, Date.now() / 1000, DAYS === 'all' ? DAYS : Number(DAYS)); };
  document.head.append(el);
}
</script>
