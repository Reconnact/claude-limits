<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude limits</title>
<script>
const THEME = new URLSearchParams(location.search).get('theme');
if (THEME === 'light' || THEME === 'dark') document.documentElement.style.colorScheme = THEME;
</script>
<style>
  /* light-dark(light, dark), picked by color-scheme: the system's, or ?theme= */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#ffffff, #1c2127); --track: light-dark(#f2f4f6, #242a31); --rule: light-dark(#dde1e6, #313842); --edge: light-dark(#d3d8de, #3a424c);
    --text: light-dark(#1c2127, #e6e6e6); --text-2: light-dark(#4a525c, #a8b0bb); --text-3: light-dark(#6b7480, #8a93a0);
    --five_hour: light-dark(#1f6fe0, #3b8eff); --seven_day: light-dark(#8b3fd9, #ba66ff); --fable: light-dark(#b35f0a, #e9973f);
    --current: light-dark(#ffffff, #e6e6e6); --current-text: #1c2127; --current-shadow: light-dark(rgb(0 0 0 / .14), transparent);
    --focus: #981aff;
  }
  html { background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(1120px, 100% - 32px); padding: clamp(24px, 6vw, 72px) 0; }
  main.empty .tiles, main.empty figure, main.empty nav { display: none; }

  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 4vw, 56px); }
  #five_hour { --line: var(--five_hour); }
  #seven_day { --line: var(--seven_day); }
  #fable { --line: var(--fable); }
  h2 { display: flex; align-items: center; gap: .6em; margin: 0; font-size: 1rem; font-weight: 500; color: var(--text-2); white-space: nowrap; }
  h2::before { content: ""; flex: none; width: 1.4em; height: 3px; border-radius: 2px; background: var(--line); }
  .pct { margin: .05em 0 0; font: 200 clamp(2.4rem, 8vw, 6rem)/1.1 -apple-system, "SF Pro Display", system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .reset { margin: .2em 0 1em; min-height: 1.5em; font-size: clamp(.8rem, 1.6vw, .95rem); color: var(--text-2); }
  .bar { height: 3px; border-radius: 2px; background: var(--rule); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--line); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-top: clamp(40px, 7vw, 80px); }
  #asof { font-size: .85rem; color: var(--text-3); }
  main.stale #asof { color: var(--text); }
  .navs { display: flex; flex-wrap: wrap; gap: 12px; }
  nav { display: flex; padding: 3px; border: 1px solid var(--edge); border-radius: 10px; background: var(--track); }
  nav a { min-width: 3.2em; padding: .45em .8em; border-radius: 7px; font-size: .9rem; font-weight: 500; text-align: center; color: var(--text-2); text-decoration: none; }
  nav a:hover { color: var(--text); background: var(--rule); }
  nav a[aria-current] { color: var(--current-text); background: var(--current); box-shadow: 0 1px 2px var(--current-shadow), 0 0 0 .5px var(--current-shadow); }
  nav a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  figure { position: relative; margin: 20px 0 0; }
  svg { position: relative; z-index: 1; display: block; width: 100%; height: clamp(220px, 44vh, 480px); overflow: visible; }
  .grid { stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke; }
  path { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  #frames.five_hour { --line: var(--five_hour); }
  #frames.seven_day { --line: var(--seven_day); }
  /* a band, not an outline: the bg stroke keeps neighbouring windows apart */
  .frame { fill: light-dark(color-mix(in srgb, var(--line) 10%, transparent), color-mix(in srgb, var(--line) 30%, transparent)); stroke: var(--bg); stroke-width: 2; vector-effect: non-scaling-stroke; }
  #frames .fill { fill: light-dark(color-mix(in srgb, var(--line) 22%, var(--bg)), color-mix(in srgb, var(--line) 75%, var(--bg))); stroke: none; }
  #line-seven_day { stroke: var(--seven_day); }
  #line-fable { stroke: var(--fable); }
  #ramp-five_hour { stroke: var(--five_hour); }
  #ramp-seven_day { stroke: var(--seven_day); }
  #ramp-fable { stroke: var(--fable); }
  .ramp { stroke-dasharray: 3 4; }
  .axis { position: absolute; left: 0; margin: 0; font-size: .75rem; line-height: 1; color: var(--text-3); transform: translateY(calc(-100% - 5px)); }
  .axis.top { top: 0; }
  .axis.mid { top: calc(clamp(220px, 44vh, 480px) / 2); }
  #days { position: relative; height: 1.5em; margin-top: .6em; font-size: .8rem; color: var(--text-3); }
  #days span { position: absolute; padding-left: .45em; white-space: nowrap; }
  #days span::before { content: ""; position: absolute; left: 0; bottom: 0; height: calc(clamp(220px, 44vh, 480px) + 2.1em); border-left: 1px solid var(--rule); }

  .projects { margin-top: clamp(40px, 7vw, 80px); }
  #split { display: inline-flex; margin-bottom: 14px; }
  #split[hidden] { display: none; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
  th, td { padding: .55em 0; border-bottom: 1px solid var(--rule); font-weight: 400; text-align: right; white-space: nowrap; }
  th:first-child { text-align: left; overflow: hidden; text-overflow: ellipsis; }
  th:not(:first-child), td { width: 7.5em; }
  thead th { font-size: .85rem; font-weight: 500; color: var(--text-3); }
  tbody th { color: var(--text-2); }
  tfoot th, tfoot td { border-bottom: 0; font-weight: 500; }
  #unpriced { margin: .6em 0 0; font-size: .85rem; color: var(--text-3); }
  main.empty .projects { display: none; }

  @media (max-width: 560px) {
    .controls { flex-direction: column-reverse; align-items: stretch; }
    .navs { flex-direction: column; }
    nav a { flex: 1; min-width: 0; padding: .6em 0; white-space: nowrap; }
    h2 { gap: .45em; font-size: .9rem; }
    h2::before { width: .9em; }
    th:not(:first-child), td { width: 5.5em; }
  }
</style>
<main>
  <div class="tiles">
    <section id="five_hour"><h2>5 hours</h2><p class="pct"></p><p class="reset"></p><div class="bar"><i></i></div></section>
    <section id="seven_day"><h2>7 days</h2><p class="pct"></p><p class="reset"></p><div class="bar"><i></i></div></section>
    <section id="fable"><h2>Fable</h2><p class="pct"></p><p class="reset"></p><div class="bar"><i></i></div></section>
  </div>
  <div class="controls">
    <span id="asof"></span>
    <div class="navs">
      <nav aria-label="Chart line"><a data-line="steps">Steps</a><a data-line="smooth">Smooth</a></nav>
      <nav aria-label="Chart range"><a data-days="5h">5 h</a><a data-days="1">1 d</a><a data-days="7">7 d</a><a data-days="30">30 d</a><a data-days="all">All</a></nav>
    </div>
  </div>
  <figure>
    <p class="axis top">100 %</p>
    <p class="axis mid">50 %</p>
    <svg viewBox="0 0 700 160" preserveAspectRatio="none">
      <line class="grid" x1="0" x2="700" y1="0" y2="0"/>
      <line class="grid" x1="0" x2="700" y1="80" y2="80"/>
      <line class="grid" x1="0" x2="700" y1="160" y2="160"/>
      <g id="frames"></g>
      <path id="line-seven_day"/>
      <path id="line-fable"/>
      <path id="ramp-five_hour" class="ramp"/>
      <path id="ramp-seven_day" class="ramp"/>
      <path id="ramp-fable" class="ramp"/>
    </svg>
    <div id="days"></div>
  </figure>
  <section class="projects">
    <nav id="split" aria-label="Table split" hidden><a data-by="folder">Folder</a><a data-by="agent">Agent</a><a data-by="session">Session</a></nav>
    <table id="projects" hidden><thead><tr><th>Project</th><th>Tokens</th><th>API price</th></tr></thead><tbody></tbody><tfoot></tfoot></table>
    <p id="unpriced"></p>
  </section>
</main>
<script src="limits.js"></script>
<script>
// A page opened from disk may not fetch a file, but it may load one as a script.
const PARAMS = new URLSearchParams(location.search);
const DIR = PARAMS.get('dir') || 'file:///Users/Shared/claude-limits';
const RANGES = { '5h': 5 / 24, 1: 1, 7: 7, 30: 30, all: 'all' };
const days = () => PARAMS.get('days') in RANGES ? PARAMS.get('days') : '7';
const line = () => PARAMS.get('line') === 'smooth' ? 'smooth' : 'steps';
const split = () => PARAMS.get('by') in Limits.SPLITS ? PARAMS.get('by') : 'folder';
const NAV = document.querySelectorAll('nav a');
const mark = () => {
  for (const a of NAV) {
    const [key, value] = Object.entries(a.dataset)[0];
    const params = new URLSearchParams(PARAMS);
    params.set(key, value);
    a.href = `?${params}`;
    if (value === { days: days(), line: line(), by: split() }[key]) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
};
mark();
// a button redraws in place: a new page would open empty and at the top, then jump
for (const a of NAV) a.onclick = e => {
  e.preventDefault();
  PARAMS.set(...Object.entries(a.dataset)[0]);
  history.replaceState(null, '', a.href);
  mark();
  if (S.length) draw();
};
var S = [], T = [], SOURCES = [];
// a script added again with the same src comes from the cache, so each load asks for the file anew
const load = (src, done) => {
  const el = document.createElement('script');
  el.src = `${src}?${Date.now()}`;
  el.onload = el.onerror = () => { el.remove(); done(); };
  document.head.append(el);
};
const draw = () => Limits.render(document, S, Date.now() / 1000, RANGES[days()], T, PARAMS.get('reset') || undefined, line(), split());
// the data again, drawn in place: a reload would open the page empty and at the top
function refresh() {
  S = []; T = []; SOURCES = [];
  load(`${DIR}/sources.js`, () => {
    const names = [...new Set(SOURCES)];
    const files = names.flatMap(name => [`${name}.js`, `${name}-checked.js`, `${name}-tokens.js`]);
    let left = files.length;
    if (!left) draw();
    for (const file of files) load(`${DIR}/${file}`, () => { if (!--left) draw(); });
  });
}
refresh();
setInterval(refresh, 60 * 1000);
</script>
